name: Daily Contribution Auto-Updater

on:
  schedule:
    # Runs at 12:00 PM (Noon) UTC every day, which is 5:30 PM IST.
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab if needed

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate random daily commits
        run: |
          # Set up Git with your profile credentials
          git config --local user.email "kaustubh7205@gmail.com"
          git config --local user.name "Kaustubh Ghadshi"
          
          # Generate a random number of commits between 12 and 20
          NUM_COMMITS=$(( (RANDOM % 9) + 12 ))
          echo "Generating $NUM_COMMITS commits for today."
          
          for i in $(seq 1 $NUM_COMMITS); do
            # Append unique timestamp to dummy file
            echo "Automated contribution $i on $(date +'%Y-%m-%d %H:%M:%S')" >> daily_update.txt
            
            # Stage and commit each time to create a separate commit history
            git add daily_update.txt
            git commit -m "Routine update and refactoring (Task #$i)"
          done
          
          # Push all commits to GitHub at once
          git push
